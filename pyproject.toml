[tool.basedpyright]
pythonVersion = "3.11"
typeCheckingMode = "recommended"
reportImplicitRelativeImport = "none"
reportUnusedCallResult = "none"
reportImplicitStringConcatenation = "none"
include = ["scripts", "tests"]
exclude = ["**/node_modules", "**/__pycache__", "**/.*", "temp", "legacy", "work"]
executionEnvironments = [
  { root = "scripts/check" },
  { root = "scripts/harness" },
  { root = "scripts/temp" },
  { root = "scripts", extraPaths = ["scripts/harness"] },
  { root = "." },
]

[tool.ruff]
target-version = "py311"
cache-dir = "temp/cache/ruff"
extend-exclude = ["temp", "legacy", "work"]
