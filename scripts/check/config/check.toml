roots = ["apps", "packages", "extensions", "crates", "native", "scripts", "src", "tests", "examples"]
exclude_dirs = [".git", "node_modules", "temp", "dist", "target", "generated", "__pycache__"]
ruff_version = "0.17.1"

[limits.python]
warn = 800
reject = 900

[limits.typescript]
warn = 800
reject = 900

[limits.rust]
warn = 500
reject = 600
